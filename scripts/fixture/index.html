<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <title>Sistema de prueba — Matrículas</title>
    <style>
      body {
        font-family: system-ui, sans-serif;
        margin: 0;
        color: #1b1f24;
      }
      .Layout_shell__x7f2a {
        display: flex;
        min-height: 100vh;
      }
      .Sidebar_root__9k2ld {
        width: 200px;
        background: #101828;
        color: #fff;
        padding: 16px;
      }
      .Sidebar_root__9k2ld a {
        display: block;
        color: #cbd5e1;
        padding: 8px 0;
        cursor: pointer;
        text-decoration: none;
      }
      .Main_content__aa91z {
        flex: 1;
        padding: 24px;
      }
      button {
        padding: 8px 14px;
        border-radius: 6px;
        border: 1px solid #cbd5e1;
        background: #fff;
        cursor: pointer;
        font: inherit;
      }
      .Button_primary__b3n1q {
        background: #1d64d8;
        color: #fff;
        border-color: #1d64d8;
      }
      label {
        display: block;
        margin: 12px 0 4px;
        font-size: 13px;
      }
      input,
      select {
        padding: 6px 8px;
        border: 1px solid #cbd5e1;
        border-radius: 6px;
        font: inherit;
        width: 260px;
      }
      .backdrop {
        position: fixed;
        inset: 0;
        background: rgb(0 0 0 / 0.4);
        display: flex;
        align-items: center;
        justify-content: center;
      }
      .modal {
        background: #fff;
        padding: 24px;
        border-radius: 10px;
        width: 420px;
      }
      .hidden {
        display: none;
      }
      /* Menú al estilo de las librerías actuales: se abre en `pointerdown`, tapa
         la página con una capa de descarte y, al elegir una opción, se DESVANECE
         antes de desmontarse. */
      .dismiss-layer {
        position: fixed;
        inset: 0;
        z-index: 10;
      }
      .menu {
        position: absolute;
        z-index: 20;
        background: #00a2ff;
        border-radius: 8px;
        padding: 6px;
        transition: opacity 200ms linear;
      }
      .menu.closing {
        opacity: 0.15;
      }
      .menu-item {
        display: block;
        width: 160px;
        text-align: left;
        background: transparent;
        border: 0;
        color: #fff;
        padding: 8px;
      }
      table {
        border-collapse: collapse;
        margin-top: 16px;
      }
      th,
      td {
        border: 1px solid #cbd5e1;
        padding: 6px 10px;
        text-align: left;
      }
      td input[type='checkbox'] {
        width: auto;
      }
    </style>
  </head>
  <body>
    <div class="Layout_shell__x7f2a">
      <nav class="Sidebar_root__9k2ld">
        <strong>Instituto</strong>
        <a id="nav-matriculas" data-view="matriculas">Matrículas</a>
        <a id="nav-alumnos" data-view="alumnos">Alumnos</a>
      </nav>

      <main class="Main_content__aa91z">
        <!-- Vista "matrículas": se muestra/oculta sin cambiar la URL,
             como haría el App Router de Next con navegación cliente. -->
        <section id="view-matriculas">
          <h1>Matrículas</h1>
          <button data-testid="nueva-matricula" class="Button_primary__b3n1q">
            Nueva matrícula
          </button>
          <button aria-label="Exportar listado">⤓</button>

          <!--
            Botón que abre su menú en `pointerdown` y monta una capa de descarte:
            el `pointerup` cae en esa capa, así que el botón NUNCA recibe un
            `click` y el navegador dispara el suyo sobre el ancestro común. Es el
            patrón de Radix y compañía; sin tratarlo, pulsarlo no generaba paso.
          -->
          <button id="ver">Ver</button>
          <div id="ver-menu" class="menu hidden">
            <button class="menu-item" id="ver-editar">Editar</button>
            <button class="menu-item" id="ver-eliminar">Eliminar</button>
          </div>

          <!--
            Tabla de registros: cada fila tiene su casilla. Marcar dos filas son
            dos acciones sobre dos registros, no un formulario que se rellena.
          -->
          <table id="tabla-usuarios">
            <thead>
              <tr>
                <th><input type="checkbox" id="sel-todos" aria-label="Seleccionar todo" /></th>
                <th>Usuario</th>
              </tr>
            </thead>
            <tbody>
              <tr>
                <td><input type="checkbox" id="sel-andy" aria-label="Seleccionar Andy" /></td>
                <td>Andy Velez</td>
              </tr>
              <tr>
                <td><input type="checkbox" id="sel-paulo" aria-label="Seleccionar Paulo" /></td>
                <td>Paulo Galarza</td>
              </tr>
            </tbody>
          </table>
        </section>

        <section id="view-alumnos" class="hidden">
          <h1>Alumnos</h1>
          <p>Listado de alumnos.</p>
          <button>Añadir alumno</button>
        </section>
      </main>
    </div>

    <!--
      Enlace que navega al instante: al capturarlo tras esperar estabilidad, la
      página ya es otra y el elemento no existe. Reproduce el «cerrar sesión».
    -->
    <p><a id="logout" href="/salir">Cerrar sesión</a></p>

    <!-- Contenedor de portal fuera del árbol principal, al estilo Radix. -->
    <div id="portal-root"></div>

    <template id="modal-template">
      <div class="backdrop" data-portal-backdrop>
        <div class="modal" role="dialog" aria-label="Nueva matrícula">
          <h2>Nueva matrícula</h2>
          <form id="matricula-form">
            <label for="alumno">Alumno</label>
            <input id="alumno" name="alumno" placeholder="Nombre del alumno" />

            <label for="clave">Clave de acceso</label>
            <input id="clave" name="clave" type="password" />

            <label for="curso">Curso</label>
            <select id="curso" name="curso">
              <option value="">Selecciona…</option>
              <option value="1a">1º A</option>
              <option value="2b">2º B</option>
            </select>

            <!--
              Interruptor al estilo de los diseños actuales: el <input> real
              está escondido y lo que se pulsa es el texto, que es HERMANO suyo.
              Al pulsarlo, el widget reenvía el clic al input por código. Sin
              tratarlo, un solo gesto generaría dos pasos y ninguno se agruparía
              con el formulario, porque el texto no es un campo por sí mismo.
            -->
            <div id="estado-row" class="switch-row">
              <span class="switch-track" aria-hidden="true"></span>
              <span class="switch-text">Matrícula activa</span>
              <input id="activa" name="activa" type="checkbox" class="switch-input" />
            </div>

            <p>
              <button type="submit" class="Button_primary__b3n1q">Guardar matrícula</button>
              <button type="button" data-testid="cancelar">Cancelar</button>
            </p>
          </form>
        </div>
      </div>
    </template>

    <script>
      const portalRoot = document.getElementById('portal-root')

      document.querySelectorAll('[data-view]').forEach((link) => {
        link.addEventListener('click', () => {
          const view = link.dataset.view
          // Navegación cliente: cambia la vista sin recargar ni tocar la URL.
          document
            .getElementById('view-matriculas')
            .classList.toggle('hidden', view !== 'matriculas')
          document.getElementById('view-alumnos').classList.toggle('hidden', view !== 'alumnos')
        })
      })

      document.querySelector('[data-testid="nueva-matricula"]').addEventListener('click', () => {
        const tpl = document.getElementById('modal-template')
        // Retraso deliberado: simula la hidratación/animación de un modal real,
        // para comprobar que el grabador espera a que el DOM se estabilice.
        setTimeout(() => {
          portalRoot.appendChild(tpl.content.cloneNode(true))
        }, 250)
      })

      portalRoot.addEventListener('click', (e) => {
        if (e.target.closest('[data-testid="cancelar"]')) portalRoot.replaceChildren()

        // El interruptor reenvía el clic a su <input> escondido, como hacen las
        // librerías de componentes. Genera un segundo evento de clic para lo
        // que la persona vivió como un solo gesto.
        const row = e.target.closest('#estado-row')
        if (row && e.target.id !== 'activa') {
          row.querySelector('#activa').click()
        }
      })

      // Menú que se abre en `pointerdown` y se traga el `pointerup` con su capa
      // de descarte. Al elegir una opción no se desmonta: primero se desvanece,
      // que es cuando el grabador solía capturarlo medio borrado.
      const verBtn = document.getElementById('ver')
      const verMenu = document.getElementById('ver-menu')
      let dismissLayer = null

      verBtn.addEventListener('pointerdown', () => {
        verMenu.classList.remove('hidden', 'closing')
        dismissLayer = document.createElement('div')
        dismissLayer.className = 'dismiss-layer'
        document.body.appendChild(dismissLayer)
      })

      verMenu.addEventListener('click', (e) => {
        if (!e.target.closest('.menu-item')) return
        verMenu.classList.add('closing')
        // Se desmonta MUCHO después de la captura: así el paso se enfrenta al
        // caso difícil (el elemento sigue ahí, pero ya no se lee).
        setTimeout(() => {
          verMenu.classList.add('hidden')
          dismissLayer?.remove()
          dismissLayer = null
        }, 4000)
      })

      portalRoot.addEventListener('submit', (e) => {
        e.preventDefault()
        portalRoot.replaceChildren()
      })
    </script>
  </body>
</html>
